server:
  port: 8081

spring:
  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://localhost:5432/orders
    username: postgres
    password: postgres

  jpa:
    hibernate:
      # Hibernate never creates/alters tables; Flyway owns the schema.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: order-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: com.example.orders.events
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Boot 4 / Jackson 3 — not the deprecated JsonSerializer (Jackson 2).
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        # Include Java type in headers (handy in one service; fragile across services — lab 8).
        spring.json.add.type.headers: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
