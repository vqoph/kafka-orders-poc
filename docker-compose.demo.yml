# Full demo stack (infra + 4 Spring services + MF frontend).
# Local validation:
#   docker compose -f docker-compose.demo.yml up -d --build
# UI: http://localhost:8088  (only published port; apps talk on the compose network)
#
# Images default to GHCR; --build uses the Dockerfiles in this repo.

x-java-service: &java-service
  restart: unless-stopped
  mem_limit: 384m
  environment: &java-env
    SPRING_PROFILES_ACTIVE: demo
    JAVA_TOOL_OPTIONS: -Xmx256m
    APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*}
  networks:
    - demo

services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:4.0.0
    mem_limit: 768m
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - demo
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    mem_limit: 256m
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: demo
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - demo

  postgres:
    image: postgres:17-alpine
    mem_limit: 256m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - demo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    mem_limit: 64m
    networks:
      - demo
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------------------
  # Spring Boot services
  # ---------------------------------------------------------------------------
  order-service:
    <<: *java-service
    image: ghcr.io/vqoph/kafka-orders-order-service:latest
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
      args:
        SERVICE: order-service
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      <<: *java-env
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  payment-service:
    <<: *java-service
    image: ghcr.io/vqoph/kafka-orders-payment-service:latest
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
      args:
        SERVICE: payment-service
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      <<: *java-env
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8082/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  inventory-service:
    <<: *java-service
    image: ghcr.io/vqoph/kafka-orders-inventory-service:latest
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
      args:
        SERVICE: inventory-service
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      <<: *java-env
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8085/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  notification-service:
    <<: *java-service
    image: ghcr.io/vqoph/kafka-orders-notification-service:latest
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
      args:
        SERVICE: notification-service
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *java-env
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8084/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Frontend (shell + MF remotes + API reverse proxy)
  # ---------------------------------------------------------------------------
  frontend:
    image: ghcr.io/vqoph/kafka-orders-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    mem_limit: 64m
    restart: unless-stopped
    depends_on:
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    ports:
      - "8088:80"
    networks:
      - demo
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  demo:
    driver: bridge

volumes:
  kafka-data:
  postgres-data:
