name: Demo images

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.demo.yml"
      - ".github/workflows/demo-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: vqoph

jobs:
  backend-images:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - order-service
          - payment-service
          - inventory-service
          - notification-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/kafka-orders-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/docker/Dockerfile
          push: true
          build-args: |
            SERVICE=${{ matrix.service }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=backend-${{ matrix.service }}

  frontend-image:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/kafka-orders-frontend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # Pull GHCR :latest on the VPS and recreate the sandbox if it is running.
  # Secrets/vars: SSH_PRIVATE_KEY, DEPLOY_USER, DEPLOY_HOST (same as personal-vps).
  rollout:
    name: Rollout on VPS
    needs: [backend-images, frontend-image]
    runs-on: ubuntu-latest
    steps:
      - name: Pull and recreate sandbox
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            DIR=/opt/qoph/sandbox/kafka-orders
            cd "$DIR"
            echo "==> docker compose pull"
            docker compose -f docker-compose.demo.yml pull
            RUNNING="$(docker compose -f docker-compose.demo.yml ps -q 2>/dev/null || true)"
            if [ -n "$RUNNING" ]; then
              echo "==> stack running — force-recreate"
              docker compose -f docker-compose.demo.yml up -d --force-recreate --remove-orphans
              if command -v qoph-sandbox-ctl >/dev/null 2>&1; then
                qoph-sandbox-ctl wake kafka-orders || true
              fi
            else
              echo "==> stack stopped — images updated; next wake will start them"
            fi
