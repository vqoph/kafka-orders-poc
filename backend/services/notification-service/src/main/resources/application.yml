server:
  port: 8084

spring:
  application:
    name: notification-service

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: notification-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Boot 4 / Jackson 3 — not the deprecated JsonDeserializer (Jackson 2).
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: com.example.orders.events

# Redis Pub/Sub channel for SSE fan-out (see RedisNotificationFanout.CHANNEL).
notification:
  redis:
    channel: notifications.sse

management:
  endpoints:
    web:
      exposure:
        include: health,info
