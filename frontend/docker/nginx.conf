worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # Upstream aliases match docker-compose.demo.yml service names.
  upstream order_service { server order-service:8081; }
  upstream payment_service { server payment-service:8082; }
  upstream inventory_service { server inventory-service:8085; }
  upstream notification_service { server notification-service:8084; }

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API gateways (same-origin). Prefix is stripped so Spring controllers keep /orders, /payments, …
    location /api/orders/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://order_service/;
    }

    location /api/payment/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://payment_service/;
    }

    location /api/inventory/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://inventory_service/;
    }

    location /api/notification/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 24h;
      chunked_transfer_encoding off;
      proxy_pass http://notification_service/;
    }

    # Module Federation remotes (same-origin under /mf/<name>/).
    location /mf/orders/ {
      alias /usr/share/nginx/html/mf/orders/;
      add_header Access-Control-Allow-Origin *;
    }

    location /mf/payment/ {
      alias /usr/share/nginx/html/mf/payment/;
      add_header Access-Control-Allow-Origin *;
    }

    location /mf/inventory/ {
      alias /usr/share/nginx/html/mf/inventory/;
      add_header Access-Control-Allow-Origin *;
    }

    location /mf/notification/ {
      alias /usr/share/nginx/html/mf/notification/;
      add_header Access-Control-Allow-Origin *;
    }

    location /healthz {
      access_log off;
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }

    # Shell SPA
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
